name: fastdrop_ui_editor
description: FastDrop UI Editor — mobile HTML/CSS visual editor.

publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  file_picker: ^8.1.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/editor/index.html
