name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: |
          if [ -f tool/bootstrap_platforms.sh ]; then
            chmod +x tool/bootstrap_platforms.sh
            ./tool/bootstrap_platforms.sh
          else
            flutter create --platforms=android .
          fi

      - name: Ensure Android compileSdk 36
        run: |
          # Patch app-level build files (both Groovy and KTS)
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk[[:space:]]*[=]?[[:space:]]*(flutter\.compileSdkVersion|[0-9]+)/compileSdk = 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*(flutter\.compileSdkVersion|[0-9]+)/compileSdk = 36/g' android/app/build.gradle.kts
          fi
          # Also patch project-level build files to set compileSdk in allprojects
          if [ -f android/build.gradle ]; then
            sed -i -E '/allprojects \{/a\        subprojects { afterEvaluate { project -> if (project.hasProperty("android")) { project.android { compileSdkVersion 36 } } } }' android/build.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            # For KTS, inject compileSdk directly into the android block before evaluation
            sed -i -E 's/(android\s*\{)/\1\n    compileSdk = 36/' android/build.gradle.kts
            # Also patch any subprojects if they have android blocks
            sed -i -E '/subprojects \{/a\        afterEvaluate { extensions.findByName("android")?.configure { it.compileSdkVersion = 36 } }' android/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-UI-Editor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
