name: Build iOS app (unsigned .app for SideStore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d ios ]; then flutter create . --platforms=android,ios --org com.kiabi.fastdrop --project-name fastdrop_ui_editor; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app as .ipa for SideStore
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r FastDrop-UI-Editor-unsigned.ipa Payload/
          echo "IPA_PATH=build/ios/Release-iphoneos/FastDrop-UI-Editor-unsigned.ipa" >> $GITHUB_ENV
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-UI-Editor-unsigned-ipa
          path: ${{ env.IPA_PATH }}
